version: "3.9"

services:
  backend:
    container_name: rag_agent-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    volumes:
      - ./chroma_db:/app/chroma_db
    restart: always

  frontend:
    container_name: rag_agent-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80" # ⭐ 访问 http://localhost:5173
    restart: always
