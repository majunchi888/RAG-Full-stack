services:
  backend:
    container_name: rag_agent-backend
    build:
      context: .
      dockerfile: ./backend/Dockerfile.backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: always

  frontend:
    container_name: rag_agent-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    restart: always
